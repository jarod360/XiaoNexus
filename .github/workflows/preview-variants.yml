name: Build LX04 preview variants
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*-preview*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and pinned XiaoSeek submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Go from pinned source
        uses: actions/setup-go@v5
        with:
          go-version-file: legacy/XiaoSeek/client/go.mod
          cache-dependency-path: legacy/XiaoSeek/client/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate unchanged v50.2 and new v51 gate
        run: |
          node --check experiments/v50.2/lx04_v50_gate.js
          node experiments/v50.2/test_v50.js
          node --check runtime/frida/lx04_nexus_gate.js
          node tests/test_gate.js
      - name: Parse Windows preflight without executing device operations
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/Preflight_XiaoNexus.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { $parseErrors | Format-List; exit 1 }
      - name: Test OEM event router and host controller
        run: |
          python3 -m unittest discover -s tests -p 'test_nexus_events.py' -v
          python3 -m py_compile runtime/host/controller.py runtime/host/nexus_events.py
      - name: Compile Standard and Doorbell agents plus ARMv7 supervisor
        run: sh scripts/build-variants.sh
      - name: Upload two separate bridge previews
        uses: actions/upload-artifact@v4
        with:
          name: XiaoNexus-LX04-bridge-variants
          path: |
            dist/XiaoNexus-LX04-bridge-standard-armv7.tar.gz
            dist/XiaoNexus-LX04-bridge-doorbell-armv7.tar.gz
            dist/SHA256SUMS
      - name: Publish preview-tag assets only
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: |
            Experimental XiaoNexus ARMv7 bundle: answer agent, native supervisor and Frida JS.
            Requires separate official frida-inject 16.6.6 android-arm binary.
            On-device autonomous attach/restarts and safety still await LX04 verification.
            Supervisor defaults to OBSERVE_ONLY; --enable is deliberate and not automatic.
            Standard excludes doorbell; Doorbell retains the original personal guard.
            Do not uninstall a working XiaoSeek until real-device acceptance.
          files: |
            dist/XiaoNexus-LX04-bridge-standard-armv7.tar.gz
            dist/XiaoNexus-LX04-bridge-doorbell-armv7.tar.gz
            dist/SHA256SUMS
