name: Build LX04 preview variants
on:
  workflow_dispatch:
  push:
    tags:
      - "v*-preview*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and pinned XiaoSeek submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Go from pinned legacy source
        uses: actions/setup-go@v5
        with:
          go-version-file: legacy/XiaoSeek/client/go.mod
          cache-dependency-path: legacy/XiaoSeek/client/go.sum
      - name: Set up Node.js for read-only v50.2 regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate verified Frida experiment (no device)
        run: |
          node --check experiments/v50.2/lx04_v50_gate.js
          node experiments/v50.2/test_v50.js
          python3 -m py_compile experiments/v50.2/attach_lab.py
      - name: Compile both legacy-agent build flavors
        run: sh scripts/build-variants.sh
      - name: Upload separate standard and doorbell preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiaoNexus-LX04-preview-variants
          path: |
            dist/XiaoNexus-legacy-LX04-standard-armv7.tar.gz
            dist/XiaoNexus-legacy-LX04-doorbell-armv7.tar.gz
            dist/SHA256SUMS
      - name: Publish pre-release assets on preview tags only
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: |
            Experimental legacy-agent builds only. These assets do NOT yet integrate the
            v50.2 dialogId/PCM/Toast auto-takeover runtime. Standard excludes the
            optional visual-doorbell guard; Doorbell preserves that private-use guard.
            Do not overwrite the validated device Agent without a backup and recovery test.
          files: |
            dist/XiaoNexus-legacy-LX04-standard-armv7.tar.gz
            dist/XiaoNexus-legacy-LX04-doorbell-armv7.tar.gz
            dist/SHA256SUMS
